name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundations:
    name: Workspace and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Yarn through Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Check workspace and packages
        run: yarn check

      - name: Validate release plan
        run: yarn changeset:status

  packed-consumers:
    name: Packed consumers (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22.13.0', '24.21.0']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify clean installed artifacts
        run: node tools/contract-authoring/packed-consumer.mjs
