name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NX_DAEMON: 'false'
  NX_TUI: 'false'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundations:
    name: Workspace and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Yarn through Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --immutable

      - name: Check workspace and packages
        run: yarn nx run contract-checks:check

      - name: Enforce package compatibility and release intent
        env:
          CONTRACTS_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRACTS_PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$CONTRACTS_PR_BASE" ]; then
            contracts_base="$CONTRACTS_PR_BASE"
          elif [ -n "$CONTRACTS_PUSH_BASE" ] && [ "$CONTRACTS_PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            contracts_base="$CONTRACTS_PUSH_BASE"
          else
            contracts_base="HEAD^"
          fi
          yarn nx affected -t typecheck,build,test --base="$contracts_base" --head=HEAD
          yarn nx run contract-checks:compatibility -- "$contracts_base"

  packed-consumers:
    name: Packed consumers (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22.13.0', '24.21.0']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn nx run-many -t build
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify clean installed artifacts
        run: node tools/contract-authoring/packed-consumer.mjs
